name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install the Home Assistant test harness
        # home-assistant-frontend: the `frontend` dependency imports it at setup
        run: pip install --quiet pytest-homeassistant-custom-component home-assistant-frontend ruff
      - name: Lint
        run: ruff check custom_components tests
      - name: Tests
        run: pytest -q tests

  frontend:
    name: Card bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Map geometry and editing tests
        run: npm test
      - name: Build
        run: npm run build
      - name: The committed bundle must match the sources
        run: git diff --exit-code -- ../custom_components/cmr/www/cmr.js

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
