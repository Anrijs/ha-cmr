[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["wifi_logs_default: run with the fleet Wi-Fi feed at its released default (off)"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv", "frontend", "dev"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501", "SIM117"]
