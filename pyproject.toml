[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["wifi_logs: run with the dormant fleet Wi-Fi feed enabled (the default is off)"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv", "frontend", "dev"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501", "SIM117"]
